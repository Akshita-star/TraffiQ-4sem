<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Traffic Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard">

<h1>🚦 Traffic Dashboard</h1>

<p class="welcome" id="welcomeUser"></p>

<div class="cards">

<div class="card vehicles">
<h3>Vehicles Detected</h3>
<p>Waiting for data...</p>
</div>

<div class="card congestion">
<h3>Congestion Level</h3>
<p>Waiting for data...</p>
</div>

<div class="card signals">
<h3>Active Signals</h3>
<p>Waiting for data...</p>
</div>

</div>

<p class="system-message">
Traffic monitoring system is waiting for live traffic data from sensors...
</p>

<button class="logout-btn" onclick="logout()">Logout</button>

</div>

<script>

let user=localStorage.getItem("user")

if(user){
document.getElementById("welcomeUser").innerText="Welcome "+user
}

function logout(){

localStorage.removeItem("user")

window.location.href="login.html"

}

</script>

</body>
</html>
