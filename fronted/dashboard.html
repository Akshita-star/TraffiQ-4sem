<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TraffiQ Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
    --bg:    #5d3b3b;
    --bg2:   #4a2e2e;
    --bg3:   #3a2020;
    --bdr:   #a06060;
    --bdr2:  #8a4f4f;
    --cyan:  #ffffff;
    --green: #44a060;
    --red:   #c44444;
    --amber: #c49040;
    --text:  #ffffff;
    --dim:   #d4aaaa;
    --mono:  'Share Tech Mono', monospace;
    --sans:  'Rajdhani', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
}

body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.04) 2px, rgba(0,0,0,.04) 4px);
    pointer-events: none;
    z-index: 9999;
}

.sidebar {
    width: 210px;
    background: var(--bg2);
    border-right: 1px solid var(--bdr);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
}

.logo {
    padding: 22px 20px 18px;
    font-family: var(--mono);
    font-size: 22px;
    letter-spacing: 3px;
    color: var(--cyan);
    border-bottom: 1px solid var(--bdr);
    position: relative;
}

.logo::after {
    content: 'v2.4.1';
    position: absolute;
    bottom: 8px;
    right: 14px;
    font-size: 9px;
    color: var(--dim);
}

.nav { list-style: none; padding: 12px 0; flex: 1; }

.nav li {
    padding: 11px 20px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--dim);
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: all .2s;
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
}

.nav li:hover { color: var(--text); background: rgba(255,255,255,.05); }

.nav li.active {
    color: var(--text);
    background: rgba(255,255,255,.1);
    border-left-color: var(--cyan);
}

.nav li.active::after {
    content: '▶';
    position: absolute;
    right: 16px;
    font-size: 8px;
    opacity: .6;
}

.nav li.nav-out { color: #c49090; }
.nav li.nav-out:hover { background: rgba(196,68,68,.1); }

.sidebar-footer {
    padding: 14px 16px;
    border-top: 1px solid var(--bdr);
    font-family: var(--mono);
    font-size: 11px;
}

.ping-row { display: flex; align-items: center; gap: 8px; }

.ping {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    animation: pingA 2s infinite;
}

@keyframes pingA {
    0%,100% { box-shadow: 0 0 0 0 rgba(68,160,96,.6); }
    50%      { box-shadow: 0 0 0 6px rgba(68,160,96,0); }
}

.src-tag { font-size: 9px; color: var(--dim); margin-top: 5px; letter-spacing: 1px; }

.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

header {
    padding: 14px 28px;
    border-bottom: 1px solid var(--bdr);
    background: var(--bg2);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
}

header h1 { font-size: 19px; font-weight: 700; letter-spacing: 1px; color: var(--text); }

.status-badge {
    padding: 5px 14px;
    background: rgba(68,160,96,.15);
    border: 1px solid rgba(68,160,96,.4);
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
    color: var(--green);
    letter-spacing: 1px;
}

.page { display: none; flex: 1; flex-direction: column; overflow: hidden; min-height: 0; }
.page.active { display: flex; }

.sim-topbar {
    padding: 10px 22px;
    border-bottom: 1px solid var(--bdr);
    background: var(--bg2);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
}

.sim-meta { font-family: var(--mono); font-size: 11px; color: var(--dim); display: flex; gap: 24px; }
.sim-meta b { color: var(--text); }

.sim-content { flex: 1; display: flex; overflow: hidden; min-height: 0; }

.lanes-area {
    flex: 1;
    padding: 20px 24px;
    overflow-y: auto;
    display: flex;
    align-items: center;
    justify-content: center;
}

.lane-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    width: 100%;
    max-width: 580px;
}

.lane-card {
    background: var(--bg2);
    border: 1px solid var(--bdr);
    border-radius: 10px;
    padding: 20px 18px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    transition: border-color .3s, background .3s, box-shadow .3s;
}

.lane-card.is-green {
    border-color: rgba(68,160,96,.6);
    background: rgba(68,160,96,.07);
    box-shadow: 0 0 18px rgba(68,160,96,.1);
}

.lane-card.is-amber {
    border-color: rgba(196,144,64,.6);
    background: rgba(196,144,64,.07);
}

.lane-card.is-emg {
    border-color: var(--red);
    background: rgba(196,68,68,.07);
    animation: emgFlash 1s infinite;
}

.lane-card.is-top-priority {
    border-color: #e0c040;
    box-shadow: 0 0 22px rgba(224,192,64,.25), 0 0 6px rgba(224,192,64,.15);
}

@keyframes emgFlash {
    0%,100% { background: rgba(196,68,68,.07); }
    50%      { background: rgba(196,68,68,.15); }
}

.lane-card-title { font-family: var(--mono); font-size: 13px; letter-spacing: 1px; color: var(--text); align-self: flex-start; }
.lane-card-id    { font-family: var(--mono); font-size: 9px; color: var(--dim); align-self: flex-start; margin-bottom: 8px; }

.traffic-light {
    display: flex;
    flex-direction: column;
    gap: 5px;
    background: #321e1e;
    border: 1px solid var(--bdr2);
    border-radius: 14px;
    padding: 8px 6px;
    margin: 2px 0 10px;
    width: 32px;
}

.tl-bulb {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #2a1818;
    transition: background .3s, box-shadow .3s;
}

.tl-bulb.on-red   { background: var(--red);   box-shadow: 0 0 8px var(--red),   0 0 18px rgba(196,68,68,.4); }
.tl-bulb.on-amber { background: var(--amber); box-shadow: 0 0 8px var(--amber), 0 0 18px rgba(196,144,64,.4); }
.tl-bulb.on-green { background: var(--green); box-shadow: 0 0 8px var(--green), 0 0 18px rgba(68,160,96,.4); }

.lane-timer { font-family: var(--mono); font-size: 26px; font-weight: 700; letter-spacing: 1px; margin-top: 2px; }
.lane-timer.t-red   { color: var(--red); }
.lane-timer.t-amber { color: var(--amber); }
.lane-timer.t-green { color: var(--green); }

.phase-lbl { font-family: var(--mono); font-size: 10px; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; margin-bottom: 10px; }

.lane-stats { width: 100%; font-size: 12px; border-top: 1px solid var(--bdr); padding-top: 10px; }
.lane-stat-row { display: flex; justify-content: space-between; padding: 3px 0; }
.ls-label { color: var(--dim); }
.ls-val   { font-family: var(--mono); color: var(--text); }

.emg-badge {
    position: absolute;
    top: 8px;
    right: 8px;
    font-size: 9px;
    padding: 2px 7px;
    background: var(--red);
    color: #fff;
    border-radius: 3px;
    font-weight: 700;
    letter-spacing: 1px;
    animation: pingA 1s infinite;
}

.priority-badge {
    position: absolute;
    top: 8px;
    left: 8px;
    font-family: var(--mono);
    font-size: 9px;
    padding: 2px 7px;
    border-radius: 3px;
    font-weight: 700;
    letter-spacing: 1px;
}

.priority-badge.rank-1 {
    background: rgba(224,192,64,.25);
    color: #e0c040;
    border: 1px solid rgba(224,192,64,.5);
}

.priority-badge.rank-2 {
    background: rgba(180,180,180,.15);
    color: #c0c0c0;
    border: 1px solid rgba(180,180,180,.3);
}

.priority-badge.rank-3 {
    background: rgba(150,100,60,.2);
    color: #c08060;
    border: 1px solid rgba(150,100,60,.3);
}

.priority-badge.rank-other {
    background: rgba(100,100,100,.15);
    color: var(--dim);
    border: 1px solid rgba(100,100,100,.2);
}

::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--bdr); border-radius: 2px; }
</style>
</head>
<body>

<div class="sidebar">
    <div class="logo">TRAFFIQ</div>
    <ul class="nav">
        <li class="active"><span></span> Simulation</li>
        <li class="nav-out" onclick="window.location='/logout'"><span>⏻</span> Logout</li>
    </ul>
    <div class="sidebar-footer">
        <div class="ping-row">
            <div class="ping" id="conn-ping" style="background:var(--amber)"></div>
            <span id="conn-lbl" style="color:var(--amber)">CONNECTING...</span>
        </div>
        <div class="src-tag" id="src-tag">SOURCE: —</div>
    </div>
</div>

<div class="main">
    <header>
        <h1>Smart Traffic Control Dashboard</h1>
        <span class="status-badge">● SYSTEM ONLINE</span>
    </header>

    <div class="page active" id="page-sim">
        <div class="sim-topbar">
            <div class="sim-meta">
                <span>Step: <b id="meta-step">0</b></span>
                <span>Total Vehicles: <b id="meta-total">0</b></span>
                <span>Alerts: <b id="meta-alerts">0</b></span>
            </div>
            <div class="sim-meta">
                <span>Top Priority: <b id="meta-top-priority">—</b></span>
                <span id="meta-src">SOURCE: —</span>
            </div>
        </div>
        <div class="sim-content">
            <div class="lanes-area">
                <div class="lane-grid" id="lane-grid"></div>
            </div>
        </div>
    </div>
</div>

<script>
let alertCount = 0;
let firstLoad  = true;
let lastEmg    = false;
let laneOrder  = {};

function renderLanes(data) {
    const lanes         = data.lanes          || {};
    const laneIds       = Object.keys(lanes);
    const grid          = document.getElementById('lane-grid');
    const topPriorityId = data.top_priority_lane || null;

    laneIds.forEach((lid, i) => { if (!laneOrder[lid]) laneOrder[lid] = i + 1; });

    [...grid.querySelectorAll('.lane-card')].forEach(c => {
        if (!lanes[c.dataset.lane]) c.remove();
    });

    laneIds.forEach(lid => {
        const info          = lanes[lid];
        const vehicles      = info.vehicles        || 0;
        const emergency     = info.emergency       || false;
        const waitTime      = info.wait_time       || 0;
        const phase         = info.phase           || 'red';
        const timeLeft      = info.time_remaining  || 0;
        const dispNum       = laneOrder[lid]       || '?';
        const priorityRank  = info.priority_rank   || 0;
        const priorityScore = info.priority_score  || 0;

        const rankLabel = `#${priorityRank}`;
        const rankClass = priorityRank === 1 ? 'rank-1'
                        : priorityRank === 2 ? 'rank-2'
                        : priorityRank === 3 ? 'rank-3'
                        : 'rank-other';

        let card = grid.querySelector(`.lane-card[data-lane="${lid}"]`);

        if (!card) {
            card = document.createElement('div');
            card.className    = 'lane-card';
            card.dataset.lane = lid;
            card.innerHTML = `
                <div class="priority-badge ${rankClass} prio-badge">${rankLabel}</div>
                <div class="lane-card-title">Lane ${dispNum}</div>
                <div class="lane-card-id">${lid}</div>
                <div class="traffic-light">
                    <div class="tl-bulb tl-red"></div>
                    <div class="tl-bulb tl-amber"></div>
                    <div class="tl-bulb tl-green"></div>
                </div>
                <div class="lane-timer t-${phase}">${timeLeft}s</div>
                <div class="phase-lbl">${phase.toUpperCase()}</div>
                <div class="lane-stats">
                    <div class="lane-stat-row">
                        <span class="ls-label">Vehicles</span>
                        <span class="ls-val veh-val">${vehicles}</span>
                    </div>
                    <div class="lane-stat-row">
                        <span class="ls-label">Wait</span>
                        <span class="ls-val wait-val">${waitTime}s</span>
                    </div>
                    <div class="lane-stat-row">
                        <span class="ls-label">Priority Score</span>
                        <span class="ls-val score-val">${priorityScore}</span>
                    </div>
                    <div class="lane-stat-row">
                        <span class="ls-label">Emergency</span>
                        <span class="ls-val emg-val">${emergency ? 'YES' : 'None'}</span>
                    </div>
                </div>
                ${emergency ? '<div class="emg-badge">EMG</div>' : ''}
            `;
            grid.appendChild(card);
        } else {
            card.querySelector('.veh-val').textContent   = vehicles;
            card.querySelector('.wait-val').textContent  = waitTime + 's';
            card.querySelector('.score-val').textContent = priorityScore;
            card.querySelector('.emg-val').textContent   = emergency ? 'YES' : 'None';

            const badge = card.querySelector('.prio-badge');
            if (badge) {
                badge.textContent = rankLabel;
                badge.className   = `priority-badge ${rankClass} prio-badge`;
            }

            const timerEl = card.querySelector('.lane-timer');
            const phaseEl = card.querySelector('.phase-lbl');
            const bR      = card.querySelector('.tl-red');
            const bA      = card.querySelector('.tl-amber');
            const bG      = card.querySelector('.tl-green');

            if (timerEl) { timerEl.textContent = timeLeft + 's'; timerEl.className = 'lane-timer t-' + phase; }
            if (phaseEl) phaseEl.textContent = phase.toUpperCase();
            if (bR) bR.className = 'tl-bulb tl-red'  + (phase === 'red'   ? ' on-red'   : '');
            if (bA) bA.className = 'tl-bulb tl-amber' + (phase === 'amber' ? ' on-amber' : '');
            if (bG) bG.className = 'tl-bulb tl-green' + (phase === 'green' ? ' on-green' : '');

            let emgBadge = card.querySelector('.emg-badge');
            if (emergency && !emgBadge) {
                const b = document.createElement('div');
                b.className   = 'emg-badge';
                b.textContent = '🚑 EMG';
                card.appendChild(b);
            } else if (!emergency && emgBadge) {
                emgBadge.remove();
            }
        }

        card.classList.toggle('is-green', phase === 'green' && !emergency);
        card.classList.toggle('is-amber', phase === 'amber' && !emergency);
        card.classList.toggle('is-emg',   emergency);
        card.classList.toggle('is-top-priority', lid === topPriorityId && !emergency);
    });
}

function renderAll(data) {
    const lanes = data.lanes || {};
    const ids   = Object.keys(lanes);

    ids.forEach((lid, i) => { if (!laneOrder[lid]) laneOrder[lid] = i + 1; });

    let total = 0, emg = false, emgLane = '';
    ids.forEach(id => {
        total += lanes[id].vehicles || 0;
        if (lanes[id].emergency) { emg = true; emgLane = id; }
    });

    document.getElementById('meta-step').textContent  = data.sim_step || 0;
    document.getElementById('meta-total').textContent = total;
    document.getElementById('meta-src').textContent   = 'SOURCE: ' + (data.source || '—').toUpperCase();

    const topId = data.top_priority_lane;
    document.getElementById('meta-top-priority').textContent =
        topId ? `Lane ${laneOrder[topId] || topId}` : '—';

    if (emg && !lastEmg) alertCount++;
    if (total > 40)      alertCount++;
    lastEmg = emg;

    if (firstLoad) { alertCount++; firstLoad = false; }

    document.getElementById('meta-alerts').textContent = alertCount;

    const isLive = data.source === 'traci';
    document.getElementById('src-tag').textContent        = 'SOURCE: ' + (data.source || '—').toUpperCase();
    document.getElementById('conn-lbl').textContent       = isLive ? 'SUMO LIVE' : 'DISCONNECTED';
    document.getElementById('conn-lbl').style.color       = isLive ? 'var(--green)' : 'var(--red)';
    document.getElementById('conn-ping').style.background = isLive ? 'var(--green)' : 'var(--red)';

    renderLanes(data);
}

async function fetchData() {
    try {
        const res  = await fetch('/api/traffic');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (data.error) { console.warn(data.error); return; }
        renderAll(data);
    } catch(e) {
        console.warn('API:', e.message);
    }
}

fetchData();
setInterval(fetchData, 2000);
</script>
</body>
</html>
