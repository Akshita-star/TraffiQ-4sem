<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TraffiQ Dashboard</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script defer src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</head>

<body>

<div class="sidebar">
<h2>TraffiQ</h2>
<ul>
<li class="active">Dashboard</li>
<li>Simulation</li>
<li>Analytics</li>
<li>Alerts</li>
<li>Settings</li>
</ul>
</div>

<div class="main">

<header>
<h1>Smart Traffic Control Dashboard</h1>
<div class="status">System Online</div>
</header>

<section class="cards">
<div class="card">
<h3>Vehicles</h3>
<p id="vehicleCount">120</p>
</div>

<div class="card">
<h3>Congestion</h3>
<p id="congestion">Medium</p>
</div>

<div class="card">
<h3>Signal State</h3>
<p id="signal">Green</p>
</div>

<div class="card alert">
<h3>Emergency</h3>
<p id="emergency">None</p>
</div>
</section>

<section class="grid">

<div class="panel simulation">
<h2>Simulation View</h2>
<div class="simBox">
Simulation Window
</div>

<div class="controls">
<button onclick="startSim()">Start</button>
<button onclick="pauseSim()">Pause</button>
<button onclick="resetSim()">Reset</button>
</div>
</div>

<div class="panel chart">
<h2>Traffic Flow</h2>
<canvas id="trafficChart"></canvas>
</div>

</section>

</div>

<script src="script.js"></script>
</body>
</html>
